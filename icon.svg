<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A35" />
      <stop offset="100%" stop-color="#101016" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38F9D7" />
      <stop offset="100%" stop-color="#43E97B" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FA709A" />
      <stop offset="100%" stop-color="#FEE140" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#667EEA" />
      <stop offset="100%" stop-color="#764BA2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bg)" />
  <rect width="1020" height="1020" x="2" y="2" rx="223" ry="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" />

  <g filter="url(#shadow)">
    <!-- Left Bar -->
    <rect x="232" y="462" width="140" height="350" rx="70" fill="url(#bar1)" />
    <!-- Middle Bar -->
    <rect x="442" y="212" width="140" height="600" rx="70" fill="url(#bar2)" />
    <!-- Right Bar -->
    <rect x="652" y="362" width="140" height="450" rx="70" fill="url(#bar3)" />
  </g>
</svg>
